<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Multi-agente Gemini — idea → refiner → estrategista</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.sub { color: #666; margin-top: 0; }
  form { display: flex; gap: 0.5rem; margin: 1.5rem 0; }
  input[type="text"] {
    flex: 1;
    padding: 0.6rem 0.8rem;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  button {
    padding: 0.6rem 1.2rem;
    font-size: 1rem;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  section.result { margin-top: 1.5rem; padding: 1rem 1.25rem; border-radius: 10px; border: 1px solid #ddd; }
  section.result h2 { font-size: 1rem; margin: 0 0 0.5rem; }
  section.result pre { white-space: pre-wrap; font-family: inherit; margin: 0; }
  #error { color: #b91c1c; margin-top: 1rem; display: none; }
  #status { color: #666; margin-top: 1rem; display: none; }
  @media (prefers-color-scheme: dark) {
    p.sub { color: #aaa; }
    input[type="text"] { background: #1a1a1a; color: #eee; border-color: #444; }
    section.result { border-color: #333; }
  }
</style>
</head>
<body>
  <h1>Multi-agente Gemini</h1>
  <p class="sub">idea_agent → refiner_agent → estrategista (supervisor), rodando como Netlify Function.</p>

  <form id="form">
    <input type="text" id="topic" placeholder="Digite um tema para o brainstorm..." required />
    <button type="submit" id="submit-btn">Gerar</button>
  </form>

  <p id="status">Consultando os agentes... (3 chamadas ao Gemini, pode levar alguns segundos)</p>
  <p id="error"></p>

  <div id="results"></div>

  <script>
    const form = document.getElementById("form");
    const topicInput = document.getElementById("topic");
    const submitBtn = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const resultsEl = document.getElementById("results");

    function renderSection(title, text) {
      const section = document.createElement("section");
      section.className = "result";
      const h2 = document.createElement("h2");
      h2.textContent = title;
      const pre = document.createElement("pre");
      pre.textContent = text;
      section.appendChild(h2);
      section.appendChild(pre);
      return section;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const topic = topicInput.value.trim();
      if (!topic) return;

      submitBtn.disabled = true;
      statusEl.style.display = "block";
      errorEl.style.display = "none";
      resultsEl.innerHTML = "";

      try {
        const res = await fetch("/.netlify/functions/agent", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic }),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || `Erro HTTP ${res.status}`);
        }

        resultsEl.appendChild(renderSection("💡 idea_agent (brainstorm)", data.ideas));
        resultsEl.appendChild(renderSection("✨ refiner_agent (refinado)", data.refined));
        resultsEl.appendChild(renderSection("📋 Plano final (estrategista)", data.finalPlan));
      } catch (err) {
        errorEl.textContent = err.message || String(err);
        errorEl.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        statusEl.style.display = "none";
      }
    });
  </script>
</body>
</html>
